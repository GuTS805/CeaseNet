name: Bug report
description: Something in the program, the site or the rules does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please do not paste keys, access keys or a wallet's phrase. A security or privacy problem goes to a private advisory: see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: "A ceasenet command, a page on the site or console, or a record's key (0x…)"
  - type: input
    id: env
    attributes:
      label: Your setup
      description: "`ceasenet status` helps, once you have checked it holds nothing private. Also your OS, Node version and MCP client."
